name: Nettiauto Alert Checker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nettiauto-check
  cancel-in-progress: false

jobs:
  check-cars:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install playwright cloudscraper beautifulsoup4
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          NETTIAUTO_URL: ${{ secrets.NETTIAUTO_URL }}
        run: python main.py   
